<div class="container">
  <div>
    <h2>Ajouter une Moto :</h2>
  </div>

  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Moto</label>
      <input type="number" [(ngModel)]="newMoto.idMoto" name="idMoto" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Marque Moto</label>
      <input type="text" [(ngModel)]="newMoto.marqueMoto" name="marqueMoto" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Modèle Moto</label>
      <input type="text" [(ngModel)]="newMoto.modeleMoto" name="modeleMoto" class="form-control">
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix Moto</label>
      <input type="number" [(ngModel)]="newMoto.prixMoto" name="prixMoto" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date Fabrication</label>
      <input type="date" [(ngModel)]="newMoto.dateFabrication" name="dateFabrication" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Categorie</label>
      <select class="form-control form-control-lg" id="idCat" name="idCat" [(ngModel)]="newidCat">
        @for(cat of categories; track cat.idCat){
        <option [value]="cat.idCat"> {{cat.nomCat}} </option>
        }
      </select>
    </div>
     
    <div class="mt-2">
      <button type="submit" (click)="addMoto()" class="btn btn-success">Ajouter</button>
      <div>
        <h3>{{ message }}</h3>
      </div>
    </div>
  </form>
</div>
